[project]
name = "forklab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "inspect-ai>=0.3.289",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "spikes"]
markers = ["docker: needs a running Docker daemon"]
